        <g id="node-platform" data-node-id="platform" data-node-label="Platform Layer" tabindex="0" role="button" aria-label="Focus Platform Layer, SDL2 / native ports, 01 / Platform" aria-pressed="false" data-node-kind="external" data-node-sublabel="SDL2 / native ports" data-node-context="01 / Platform">
