          <text data-node-label="" data-detail-anchor="" x="530" y="377" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">movie</text>
          <text data-detail="context" x="530" y="393" class="t-muted" font-size="7" text-anchor="middle">video overlay</text>
