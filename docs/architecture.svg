          <text x="422.5" y="197.5" class="t-backend" font-size="8" text-anchor="middle">render commands</text>
        </g>
        <g data-detail="context" data-edge-from="tjs2" data-edge-to="sound" data-edge-label="play BGM/SE" data-edge-key="2">
          <rect x="389.55" y="250" width="65.9" height="16" rx="4" class="c-mask"/>
          <text x="422.5" y="261" class="t-backend" font-size="8" text-anchor="middle">play BGM/SE</text>
