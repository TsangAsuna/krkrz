          <text data-detail="context" x="530" y="165" class="t-muted" font-size="7" text-anchor="middle">layered renderer</text>
        </g>

        <g id="node-sound" data-node-id="sound" data-node-label="sound" tabindex="0" role="button" aria-label="Focus sound, FAudio / SDL audio, 03 / Rendering / Media" aria-pressed="false" data-node-kind="backend" data-node-sublabel="FAudio / SDL audio" data-node-context="03 / Rendering / Media">
          <title>sound · FAudio / SDL audio · 03 / Rendering / Media</title>
