        <g id="node-movie" data-node-id="movie" data-node-label="movie" tabindex="0" role="button" aria-label="Focus movie, video overlay, 03 / Rendering / Media" aria-pressed="false" data-node-kind="backend" data-node-sublabel="video overlay" data-node-context="03 / Rendering / Media">
          <title>movie · video overlay · 03 / Rendering / Media</title>
          <rect x="474" y="356" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="474" y="356" width="112" height="58" rx="6" class="c-backend" data-animate="node" style="--step:4" stroke-width="1.5"/>
