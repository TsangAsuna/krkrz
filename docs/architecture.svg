            <path d="M 40 681 L 74 681" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="684" class="t-muted" font-size="10" font-weight="500">primary data path</text>
          </g>
          <g data-legend-semantic-kind="security" data-legend-x="190" data-legend-baseline="684" data-legend-width="128">
